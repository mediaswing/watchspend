[package]
name = "generic-accounting-system"
version = "0.1.0"
edition = "2024"
description = "A graphical budgeting app: categories, spending, and a choice of database"
license = "GPL-3.0-or-later"

[dependencies]
eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"
chrono = "0.4"
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
mysql = { version = "28", default-features = false, features = ["minimal", "derive", "buffer-pool", "native-tls"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "wav"] }
log = "0.4.33"

[profile.release]
opt-level = 2
