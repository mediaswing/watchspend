[package]
name = "generic-accounting-system"
version = "1.5.0"
edition = "2024"
description = "A graphical budgeting app: categories, spending, reports in CSV, Word, HTML and JSON, and a choice of SQLite, MariaDB or SQL Server"
license = "GPL-3.0-or-later"

[dependencies]
eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"
chrono = "0.4"
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
# TLS is rustls throughout rather than the platform's own. `native-tls` on
# Linux is OpenSSL, linked against whatever the build machine had, which made
# the released Linux binary refuse to start anywhere with an older libssl —
# and left the app needing a system certificate store that a stripped-down
# container may not have. rustls is compiled in, so all three platforms
# behave the same way and the Linux download is self-contained.
#
# `ring` is named explicitly, and matches what `ureq` asks for below: rustls
# 0.23 picks its crypto provider process-wide, and two crates disagreeing
# about which one is a panic on the first connection rather than a build
# error.
mysql = { version = "28", default-features = false, features = ["minimal", "derive", "buffer-pool", "rustls-tls-ring"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["compat"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "wav"] }
log = "0.4.33"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
# Only to ask a font file whether it has a glyph for a character, which is how
# the language files are checked for characters the bundled font cannot draw —
# see `i18n`. egui's own `Fonts::has_glyph` cannot answer this: it reports false
# for every character that happens to live in the same face as the replacement
# glyph, which is most of the arrows and symbols in the app's own labels.
# Already in the tree via `egui`, so naming it here costs no extra build.
ab_glyph = "0.2"

[profile.release]
opt-level = 2
